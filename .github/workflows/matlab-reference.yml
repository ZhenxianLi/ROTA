name: matlab-reference

# Black-box reference comparison (ROADMAP sections 5.2 and 5.5). Run it by hand from
# Actions -> matlab-reference -> Run workflow, or by pushing a change to the files below.
# MATLAB is used only through documented public functions with explicit parameters
# (validation/matlab/run_reference.m). Its output stays in the workflow artifact and is not
# committed: the licence terms must be confirmed before it is published (ROADMAP 5.5).
#
# One job per case runs the MATLAB calls in parallel; the report job collects their output and
# runs compare.py once over all cases. MATLAB's Vold-Kalman calls take minutes per call on the
# long multi-order cases (iterative solver), so for T2, T3 and T14 they run in jobs of their own
# (ROTA_ORDER_REF_PART: main, vkwave, vktrack); compare.py merges the parts of a case.

on:
  workflow_dispatch:
  push:
    paths:
      - "validation/matlab/**"
      - "validation/export_mat.py"
      - "validation/compare.py"
      - ".github/workflows/matlab-reference.yml"

permissions:
  contents: read

jobs:
  reference:
    name: reference (${{ matrix.case }}, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: T1, part: all }
          - { case: T2, part: main }
          - { case: T2, part: vkwave }
          - { case: T2, part: vktrack }
          - { case: T3, part: main }
          - { case: T3, part: vkwave }
          - { case: T3, part: vktrack }
          - { case: T5, part: all }
          - { case: T6, part: all }
          - { case: T14, part: main }
          - { case: T14, part: vkwave }
          - { case: T14, part: vktrack }
          - { case: VKBW, part: all }
    env:
      ROTA_ORDER_REF_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rota-order
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export the validation signal (.mat)
        run: python validation/export_mat.py ${{ matrix.case }}

      # For a public repository MathWorks licenses MATLAB automatically on a GitHub-hosted runner.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Signal_Processing_Toolbox

      # The working directory is the repository root. The script finds its folders from its own
      # location, processes every file in validation/signals (here the one case of this job) and
      # catches the error of every call, so a failing call does not stop the run.
      - name: Run the reference calls
        uses: matlab-actions/run-command@v2
        with:
          command: run('validation/matlab/run_reference.m')

      - name: Upload the reference output of this case
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reference-${{ matrix.case }}-${{ matrix.part }}
          path: validation/reference/
          if-no-files-found: warn

  report:
    needs: reference
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rota-order
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Export the validation signals (.mat)
        run: python validation/export_mat.py

      - name: Download the reference output of every case
        uses: actions/download-artifact@v4
        with:
          pattern: reference-*
          path: parts

      # <case>_ref.mat and <case>_ref_<part>.mat of every job, the logs one after the other,
      # versions.txt of the first job.
      - name: Collect the reference output
        run: |
          mkdir -p validation/reference
          : > validation/reference/log.txt
          for d in parts/reference-*; do
            [ -d "$d" ] || continue
            cp "$d"/*_ref*.mat validation/reference/ 2>/dev/null || true
            if [ -f "$d/log.txt" ]; then cat "$d/log.txt" >> validation/reference/log.txt; fi
            if [ -f "$d/versions.txt" ] && [ ! -f validation/reference/versions.txt ]; then
              cp "$d/versions.txt" validation/reference/
            fi
          done
          ls -l validation/reference

      - name: Compare rota-order, truth and MATLAB
        run: python validation/compare.py --out validation/reference/report.md

      - name: Upload the reference output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: matlab-reference
          path: validation/reference/
          if-no-files-found: warn

      - name: Add the report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f validation/reference/report.md ]; then
            head -c 900000 validation/reference/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written (see the log of the previous steps)." >> "$GITHUB_STEP_SUMMARY"
          fi
